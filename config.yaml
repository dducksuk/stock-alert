# ============================================================
#  주식 조건 알림 설정 파일
#  이 파일만 고치면 감시 종목과 알림 조건을 바꿀 수 있습니다.
# ============================================================

# ---- 1. 감시할 종목 -----------------------------------------
universe:
  # top_market_cap : 아래 candidates 중 시가총액 상위 top_n 개를 매일 자동 선정
  # fixed          : fixed 목록만 감시
  mode: top_market_cap
  top_n: 15

  # 시총 순위를 계산할 후보 풀 (나스닥 대형주). 상장폐지/조회 실패 종목은 자동으로 건너뜀
  candidates:
    - AAPL   # 애플
    - NVDA   # 엔비디아
    - MSFT   # 마이크로소프트
    - GOOGL  # 알파벳
    - AMZN   # 아마존
    - META   # 메타
    - AVGO   # 브로드컴
    - TSLA   # 테슬라
    - WMT    # 월마트
    - SPCX   # 스페이스X (티커 확인 필요)
    - AMD    # AMD
    - MU     # 마이크론
    - COST   # 코스트코
    - NFLX   # 넷플릭스
    - ASML   # ASML
    - PLTR   # 팔란티어
    - CSCO   # 시스코
    - INTC   # 인텔
    - AMAT   # 어플라이드 머티리얼즈
    - LRCX   # 램리서치
    - KLAC   # KLA
    - TMUS   # T-모바일
    - QCOM   # 퀄컴
    - ARM    # ARM

  fixed: [AAPL, NVDA, MSFT]

  # 순위와 상관없이 항상 함께 감시할 종목 (예: VOO, QQQ)
  extra: [VOO, QQQ]

# ---- 2. 실행 시간 -------------------------------------------
# true 이면 미국 정규장(뉴욕시간 09:30~16:00, 평일)에만 검사
market_hours_only: true

# ---- 3. 알림 조건 -------------------------------------------
# 규칙(rule) 하나 = 알림 하나. conditions 안의 조건을 "모두" 만족하면 알림.
#
# 사용 가능한 indicator
#   rsi          : RSI            (period, 기본 14)
#   price        : 현재가
#   change_pct   : 전일 종가 대비 등락률(%)
#   sma / ema    : 이동평균        (period 필수)
#   drawdown_pct : 최근 period 봉 최고가 대비 하락률(%, 음수)
#   volume_ratio : 최근 봉 거래량 / 직전 period 봉 평균 거래량
#
# timeframe : 15m, 30m, 1h, 1d, 1wk
# op        : <  <=  >  >=  crosses_below(아래로 돌파)  crosses_above(위로 돌파)
# value     : 숫자, 또는 다른 지표 (예: {indicator: sma, period: 200, timeframe: 1d})
#
# tickers   : (선택) 이 규칙을 특정 종목에만 적용. 예: tickers: [NVDA]
#
# 중복 방지: 조건을 만족하는 동안에는 한 번만 알림.
#           조건에서 벗어났다가 다시 들어오면 다시 알림 (단, cooldown_hours 이내면 생략)

rules:
  - id: rsi_oversold_1h
    name: "1시간봉 RSI 과매도"
    enabled: true
    conditions:
      - indicator: rsi
        timeframe: 1h
        period: 14
        op: "<"
        value: 27
    cooldown_hours: 6
    memo: "VOO 분할매수 또는 해당 종목 저가매수 검토"

  - id: rsi_nvda_35
    name: "엔비디아 RSI 35 미만"
    enabled: true
    tickers: [NVDA]
    conditions:
      - indicator: rsi
        timeframe: 1h
        period: 14
        op: "<"
        value: 35
    cooldown_hours: 6
    memo: "엔비디아 저가매수 검토"

  - id: big_drop_day
    name: "하루 -5% 급락"
    enabled: true
    conditions:
      - indicator: change_pct
        timeframe: 1d
        op: "<="
        value: -5
    cooldown_hours: 12
    memo: "급락 원인(뉴스) 확인"

  # ---- 아래는 예시입니다. enabled: true 로 바꾸면 작동합니다 ----

  - id: rsi_oversold_and_below_200ma
    name: "RSI 과매도 + 200일선 아래"
    enabled: false
    conditions:
      - indicator: rsi
        timeframe: 1h
        period: 14
        op: "<"
        value: 30
      - indicator: price
        timeframe: 1d
        op: "<"
        value: {indicator: sma, period: 200, timeframe: 1d}
    cooldown_hours: 24
    memo: "장기 추세 이탈 - 신중하게"
