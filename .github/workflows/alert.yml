name: stock-alert

on:
  schedule:
    # 평일 UTC 13~21시 매 30분 (= 한국시간 밤 10시~새벽 6시대).
    # 실제 정규장 여부는 main.py 가 뉴욕 시간으로 다시 확인합니다. (서머타임 자동 대응)
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: test-telegram
        options: [test-telegram, dry-run, force, demo]
      demo:
        description: "demo 모드용 가상 값 (티커:RSI)"
        type: string
        default: "SPCX:12"

permissions:
  contents: write           # state.json 저장(커밋)용

concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
          DEMO: ${{ github.event.inputs.demo }}
        run: |
          case "$MODE" in
            demo)          python main.py --demo "$DEMO" ;;
            test-telegram) python main.py --test-telegram ;;
            dry-run)       python main.py --dry-run ;;
            force)         python main.py --force ;;
            *)             python main.py ;;
          esac

      - name: Save state
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "stock-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "update alert state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
