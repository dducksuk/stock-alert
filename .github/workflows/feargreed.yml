name: fear-greed

# CNN 공포·탐욕 지수를 미국 정규장 시작 1시간 뒤(뉴욕 10:30)에 하루 한 번 보냅니다.
# 뉴욕 10:30 = UTC 14:30(서머타임) / 15:30(겨울). 그 주변에 10분마다 깨어나고,
# 실제 발송 여부(시간·하루 1회·휴장일)는 main.py 가 뉴욕 시간으로 판단합니다.
on:
  schedule:
    - cron: "*/10 14-16 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (force = 지금 바로 한 번 보내기)"
        type: choice
        default: force
        options: [force, dry-run]

permissions:
  contents: write

concurrency:
  group: fear-greed
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fear & Greed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$MODE" in
            force)   python main.py --fear-greed --force ;;
            dry-run) python main.py --fear-greed --dry-run ;;
            *)       python main.py --fear-greed ;;
          esac

      - name: Save state
        run: |
          if [ -f fng_state.json ]; then git add fng_state.json; fi
          if ! git diff --cached --quiet; then
            git config user.name "stock-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "update fear-greed state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep $((i * 5))
            done
          fi
